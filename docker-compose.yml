services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nightingale
      POSTGRES_PASSWORD: nightingale
      POSTGRES_DB: nightingale
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightingale"]
      interval: 5s
      timeout: 5s
      retries: 10

  # s3 compatible object store, this is the "sealed vault" in ARCHITECTURE.md.
  # was minio, but minio locked its free docker images behind a login in 2025, so this
  # is seaweedfs instead: apache-2.0, actively maintained, no corporate paywall on the
  # image. same s3 api either way, packages/api/src/vault.ts doesn't care which one it's
  # talking to. credentials come from docker/seaweedfs-s3-config.json (dev only, fake creds)
  vault:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3config.json
    ports:
      - "9000:9000"
    volumes:
      - vault-data:/data
      - ./docker/seaweedfs-s3-config.json:/etc/seaweedfs/s3config.json:ro

volumes:
  postgres-data:
  vault-data:
