name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: typescript (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # no version pinned here on purpose, it reads packageManager from package.json instead.
      # pinning both places is what broke this the first time (ERR_PNPM_BAD_PM_VERSION)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @nightingale/web lint
      - run: pnpm run test

  device:
    name: device (fmt + clippy + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: device

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
