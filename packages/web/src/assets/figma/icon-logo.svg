<svg width="29.1562" height="29.1562" viewBox="0 0 29.1562 29.1562" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- the two-peak mark, textured gradient: tangerine into sunset into viridian into navy, with grain -->
<defs>
  <linearGradient id="ng-grad" x1="6" y1="9" x2="25" y2="20" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#F06A45"/>
    <stop offset="0.35" stop-color="#BD4B2B"/>
    <stop offset="0.7" stop-color="#3D5889"/>
    <stop offset="1" stop-color="#192B52"/>
  </linearGradient>
  <filter id="ng-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="2.4" numOctaves="2" seed="7" result="noise"/>
    <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  1.6 0 0 0 -0.55" result="speck"/>
    <feComposite in="speck" in2="SourceAlpha" operator="in" result="speckIn"/>
    <feBlend in="SourceGraphic" in2="speckIn" mode="overlay"/>
  </filter>
</defs>
<path d="M17.0078 9.71875L24.2969 19.4375H17.0078H7.28906V9.71875L17.0078 19.4375V9.71875Z" fill="url(#ng-grad)" stroke="url(#ng-grad)" stroke-width="1.94375" stroke-linecap="round" stroke-linejoin="round" filter="url(#ng-grain)"/>
</svg>
