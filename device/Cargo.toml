[package]
name = "nightingale-device"
version = "0.0.0"
edition = "2021"
publish = false

# gpio/rppal, config/toml land when the capture state machine does (milestone 7b/7c)
[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
httpmock = "0.7"

[[bin]]
name = "nightingale-device"
path = "src/main.rs"
